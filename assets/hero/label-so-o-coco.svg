<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024">
  <!-- The Só o Coco can label: one strip for the can's Body_Label UV (DESIGN.md § Can label: Barraca).
       Seam on the can's left side (x = 0 = 2048); front centred at x = 512, side at 1024, back at 1536.
       Rasterised by scripts/build-hero-assets.ts; the fonts sit next to this file.
       The back-panel wording is a placeholder until the Copy ticket approves it. -->
  <defs>
    <style>
      @font-face { font-family: "Bowlby One"; src: url("fonts/BowlbyOne-Regular.ttf"); }
      @font-face { font-family: "Figtree"; src: url("fonts/Figtree-wght.ttf"); font-weight: 300 900; }
      .display { font-family: "Bowlby One"; }
      .body { font-family: "Figtree"; }
    </style>
    <!-- Painted-board grain at about 9% Fibra; stitched so it meets itself at the seam. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .227 0 0 0 0 .165 0 0 0 0 .114 0 0 0 .09 0" result="ink"/>
      <feComposite in="ink" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="symbol-cut"><polygon points="0,100 0,0 54,0 100,34 100,100"/></clipPath>
  </defs>

  <!-- Husk: the top two-thirds of every can. -->
  <rect width="2048" height="1024" fill="#7BA23F"/>
  <!-- Flavour band below the machete cut; Só o Coco's band is Polpa. The cut tiles across the seam. -->
  <path fill="#FAFAF5" d="M0,1024 L0,660 L64,686 L128,642 L192,694 L256,650 L320,682 L384,630 L448,674 L512,654 L576,690 L640,638 L704,678 L768,646 L832,688 L896,634 L960,670 L1024,660 L1088,686 L1152,642 L1216,694 L1280,650 L1344,682 L1408,630 L1472,674 L1536,654 L1600,690 L1664,638 L1728,678 L1792,646 L1856,688 L1920,634 L1984,670 L2048,660 L2048,1024 Z"/>
  <path fill="none" stroke="#3A2A1D" stroke-width="8" stroke-linejoin="round" d="M-64,670 L0,660 L64,686 L128,642 L192,694 L256,650 L320,682 L384,630 L448,674 L512,654 L576,690 L640,638 L704,678 L768,646 L832,688 L896,634 L960,670 L1024,660 L1088,686 L1152,642 L1216,694 L1280,650 L1344,682 L1408,630 L1472,674 L1536,654 L1600,690 L1664,638 L1728,678 L1792,646 L1856,688 L1920,634 L1984,670 L2048,660 L2112,686"/>

  <!-- Front (u = 0.25) -->
  <!-- The symbol on the husk: a Casca funda coconut outlined in Fibra, so it never reads as a dark ball. -->
  <g transform="translate(427 45) scale(1.7)">
    <circle cx="50" cy="54" r="42" fill="#4E7A1F" stroke="#3A2A1D" stroke-width="4" clip-path="url(#symbol-cut)"/>
    <path d="M56 13 L91 37 L88 44 L52 18 Z" fill="#FAFAF5" stroke="#3A2A1D" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="72" cy="28" rx="7" ry="3" transform="rotate(34 72 28)" fill="#DCE6EA"/>
  </g>
  <text class="display" x="512" y="350" fill="#3A2A1D" font-size="104" text-anchor="middle" letter-spacing="-2"
    dy="0 -3 -2 -1 0 1 2 3" rotate="-3 1 -1 2 -2 1 -1 3">SoloCoco</text>
  <text class="body" x="512" y="430" fill="#3A2A1D" font-size="38" font-weight="600" text-anchor="middle">Levemente gaseificado</text>
  <!-- Polpa roundel across the cut, with the hard Fibra shadow. -->
  <circle cx="524" cy="646" r="150" fill="#3A2A1D"/>
  <circle cx="512" cy="630" r="150" fill="#FAFAF5" stroke="#3A2A1D" stroke-width="6"/>
  <!-- Painted coconut half, juice-stand menu style. -->
  <g transform="translate(387 505) scale(1.25)" stroke="#3A2A1D" stroke-linejoin="round">
    <ellipse cx="100" cy="108" rx="90" ry="78" fill="#6E8F35" stroke-width="6"/>
    <ellipse cx="100" cy="104" rx="68" ry="56" fill="#FAFAF5" stroke-width="4"/>
    <ellipse cx="100" cy="102" rx="44" ry="34" fill="#DCE6EA" stroke="none"/>
    <path d="M64 86 Q78 70 102 68" stroke="#FAFAF5" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/>
  </g>
  <text class="display" x="512" y="905" fill="#3A2A1D" font-size="96" text-anchor="middle" letter-spacing="-2"
    transform="rotate(-1.5 512 905)">Só o Coco</text>
  <text class="body" x="512" y="975" fill="#3A2A1D" font-size="32" font-weight="700" text-anchor="middle">350 ml</text>

  <!-- Side (u = 0.5): a smaller painted fruit on the band. -->
  <g transform="translate(949 775) scale(.75)" stroke="#3A2A1D" stroke-linejoin="round">
    <ellipse cx="100" cy="108" rx="90" ry="78" fill="#6E8F35" stroke-width="6"/>
    <ellipse cx="100" cy="104" rx="68" ry="56" fill="#FAFAF5" stroke-width="4"/>
    <ellipse cx="100" cy="102" rx="44" ry="34" fill="#DCE6EA" stroke="none"/>
    <path d="M64 86 Q78 70 102 68" stroke="#FAFAF5" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- Back (u = 0.75) -->
  <text class="display" x="1536" y="200" fill="#3A2A1D" font-size="112" text-anchor="middle" letter-spacing="-2"
    transform="rotate(-2 1536 200)">Só o coco.</text>
  <text class="body" x="1536" y="330" fill="#3A2A1D" font-size="40" font-weight="500" text-anchor="middle">
    <tspan x="1536">Água de coco, polpa de coco</tspan>
    <tspan x="1536" dy="52">e gás carbônico.</tspan>
    <tspan x="1536" dy="104">35 kcal e 3 g de açúcar</tspan>
    <tspan x="1536" dy="52">por lata.</tspan>
  </text>
  <text class="body" x="1536" y="880" fill="#3A2A1D" font-size="36" font-weight="600" text-anchor="middle">
    <tspan x="1536">350 ml</tspan>
    <tspan x="1536" dy="47">Feito no Brasil, sem pressa.</tspan>
  </text>

  <!-- Grain over everything, baked into the texture. -->
  <rect width="2048" height="1024" fill="#000" filter="url(#grain)"/>
</svg>
